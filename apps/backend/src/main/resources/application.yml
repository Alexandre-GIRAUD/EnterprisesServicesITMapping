spring:
  application:
    name: enterprise-it-mapping-backend
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${SPRING_AI_MODEL:gpt-4o-mini}
          temperature: 0.2

  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:password}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/itmapping}
    username: ${DATABASE_USER:itmapping}
    password: ${DATABASE_PASSWORD:itmapping}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# Actuator (health, metrics)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Demo: insert sample applications + dependencies when DB has no Application nodes
app:
  # GitHub: server-side PAT only (OAuth flow can replace this later).
  # Export GITHUB_TOKEN in the environment; never send tokens to the frontend.
  integrations:
    github:
      token: ${GITHUB_TOKEN:}
      api-base-url: https://api.github.com
      max-repos: 100
      webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
      webhook-branch: ${GITHUB_WEBHOOK_BRANCH:refs/heads/main}
      max-diff-files: ${GITHUB_MAX_DIFF_FILES:80}
      max-diff-kb: ${GITHUB_MAX_DIFF_KB:512}
    # Module-discovery agent budgets (model transport is under spring.ai.openai.*).
    llm:
      module-discovery:
        max-tool-iterations: 25
        max-grep-hits: 50
        max-read-chars-per-file: 12000
        max-tree-entries: 500
        clone-timeout-seconds: 120
      # Connection-discovery agent budgets (application-to-application DEPENDS_ON edges).
      connection-discovery:
        max-tool-iterations: 35
        max-grep-hits: 50
        max-read-chars-per-file: 12000
        max-tree-entries: 500
        clone-timeout-seconds: 120
        skip-low-confidence: false
        max-catalog-apps-in-prompt: 500
  sample-data:
    seed: ${SAMPLE_DATA_SEED:true} # set SAMPLE_DATA_SEED=false to disable
    # Neo4j may not accept Bolt immediately (Docker order, cold start, APOC). Retry before giving up.
    max-attempts: ${SAMPLE_DATA_MAX_ATTEMPTS:30}
    retry-delay-ms: ${SAMPLE_DATA_RETRY_DELAY_MS:2000}
  # Max CONTAINS hops for GET /applications/{id}/module-graph (capped in code at 50).
  module-graph:
    max-depth: ${APP_MODULE_GRAPH_MAX_DEPTH:10}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    bootstrap-admin:
      username: ${ADMIN_BOOTSTRAP_USERNAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# JWT: set JWT_SECRET (>= 32 UTF-8 bytes for HS256). First admin: ADMIN_BOOTSTRAP_USERNAME / ADMIN_BOOTSTRAP_PASSWORD when users table is empty.

# Module discovery: INFO logs clone + agent summary; DEBUG adds per-tool-call detail (grep/read/list).
logging:
  level:
    com.enterprise.itmapping.feature.applications.application.ModuleSuggestionService: DEBUG
    com.enterprise.itmapping.feature.applications.application.ModuleDiscoveryAgent: DEBUG
    com.enterprise.itmapping.feature.applications.application.ModuleDiscoveryTools: DEBUG
    com.enterprise.itmapping.feature.applications.application.ApplicationConnectionSuggestionService: DEBUG
    com.enterprise.itmapping.feature.applications.application.ConnectionDiscoveryAgent: DEBUG
    com.enterprise.itmapping.feature.applications.application.ApplicationConnectionEdgeWriter: DEBUG
    com.enterprise.itmapping.feature.integrations.github.application.GitHubRepoCloneService: INFO
