spring:
  application:
    name: enterprise-it-mapping-backend

  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:password}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/itmapping}
    username: ${DATABASE_USER:itmapping}
    password: ${DATABASE_PASSWORD:itmapping}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# Actuator (health, metrics)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Demo: insert sample applications + dependencies when DB has no Application nodes
app:
  # GitHub: server-side PAT only (OAuth flow can replace this later).
  # Export GITHUB_TOKEN in the environment; never send tokens to the frontend.
  integrations:
    github:
      token: ${GITHUB_TOKEN:}
      api-base-url: https://api.github.com
      max-repos: 100
    # OpenAI-compatible chat (server key only; never expose to browser).
    llm:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com
      chat-completions-path: /v1/chat/completions
      model: gpt-4o-mini
      timeout-ms: 120000
      max-completion-tokens: 4096
      max-user-prompt-chars: 120000
      max-paths-in-prompt: 800
      max-readme-chars-in-prompt: 8000
      # Agentic file-reading loop (Pass 1 selection -> read -> Pass 2 analysis).
      enable-agentic-file-reading: true
      max-iterations: 3
      max-files-per-iteration: 10
      max-files-total: 25
      max-chars-per-file: 12000
      max-total-content-chars: 80000
      # Condensed multi-turn selection chat: cap on history size (excl. system prompt).
      max-selection-history-chars: 60000
  sample-data:
    seed: ${SAMPLE_DATA_SEED:true} # set SAMPLE_DATA_SEED=false to disable
    # Neo4j may not accept Bolt immediately (Docker order, cold start, APOC). Retry before giving up.
    max-attempts: ${SAMPLE_DATA_MAX_ATTEMPTS:30}
    retry-delay-ms: ${SAMPLE_DATA_RETRY_DELAY_MS:2000}
  # Max CONTAINS hops for GET /applications/{id}/module-graph (capped in code at 50).
  module-graph:
    max-depth: ${APP_MODULE_GRAPH_MAX_DEPTH:10}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    bootstrap-admin:
      username: ${ADMIN_BOOTSTRAP_USERNAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# JWT: set JWT_SECRET (>= 32 UTF-8 bytes for HS256). First admin: ADMIN_BOOTSTRAP_USERNAME / ADMIN_BOOTSTRAP_PASSWORD when users table is empty.

# Module suggestion: INFO logs file-selection summary and final result; DEBUG adds per-iteration detail.
logging:
  level:
    com.enterprise.itmapping.feature.applications.application.ModuleSuggestionService: DEBUG
