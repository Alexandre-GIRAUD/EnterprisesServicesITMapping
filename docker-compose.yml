services:
  postgres:
    image: postgres:16-alpine
    container_name: itmapping-postgres
    environment:
      POSTGRES_DB: itmapping
      POSTGRES_USER: itmapping
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itmapping -d itmapping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  neo4j:
    image: neo4j:5-community
    container_name: itmapping-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes: 
      - neo4j_data:/data
    # Cold start (first pull, APOC, DB init) can exceed a short health window; start_period avoids false "unhealthy".
    healthcheck:
      test:
        [
          "CMD",
          "cypher-shell",
          "-a",
          "bolt://127.0.0.1:7687",
          "-u",
          "neo4j",
          "-p",
          "password",
          "RETURN 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 90s

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: itmapping-backend
    # Host 8080 is often already in use (local Spring Boot, etc.). Use 8081 on host by default.
    # Override: BACKEND_HOST_PORT=8090 docker compose up -d
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      DATABASE_URL: jdbc:postgresql://postgres:5432/itmapping
      DATABASE_USER: itmapping
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-itmapping}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      # Browser Origin of the SPA (scheme+host+port). Default * so a VPS IP/domain
      # is not rejected with 403 Invalid CORS request on /api/auth/login.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: itmapping-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  neo4j_data:
  postgres_data:
