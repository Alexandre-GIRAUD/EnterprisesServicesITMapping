services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: itmapping-postgres
    environment:
      POSTGRES_DB: itmapping
      POSTGRES_USER: itmapping
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itmapping -d itmapping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  neo4j:
    image: neo4j:5-community
    container_name: itmapping-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes: 
      - neo4j_data:/data
    # Cold start (first pull, APOC, DB init) can exceed a short health window; start_period avoids false "unhealthy".
    healthcheck:
      test:
        [
          "CMD",
          "cypher-shell",
          "-a",
          "bolt://127.0.0.1:7687",
          "-u",
          "neo4j",
          "-p",
          "password",
          "RETURN 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 90s

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: itmapping-backend
    # Host 8080 is often already in use (local Spring Boot, etc.). Use 8081 on host by default.
    # Override: BACKEND_HOST_PORT=8090 docker compose up -d
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      DATABASE_URL: jdbc:postgresql://postgres:5432/itmapping
      DATABASE_USER: itmapping
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-itmapping}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      # Browser Origin of the SPA (scheme+host+port). Default * so a VPS IP/domain
      # is not rejected with 403 Invalid CORS request on /api/auth/login.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # OpenAI chat model and temperature used by every AI scan; some models only accept temperature 1.
      SPRING_AI_MODEL: ${SPRING_AI_MODEL:-gpt-4o}
      SPRING_AI_TEMPERATURE: ${SPRING_AI_TEMPERATURE:-0.2}
      # Log final functional-doc JSON (truncated). Set false on shared/prod hosts.
      APP_FUNCTIONAL_DOC_LOG_FINAL_PAYLOAD: ${APP_FUNCTIONAL_DOC_LOG_FINAL_PAYLOAD:-true}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:-INFO}
      # Self-service signup (cloud). Off by default; when on, GITHUB_TOKEN must be empty.
      APP_SIGNUP_ENABLED: ${APP_SIGNUP_ENABLED:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      # Defaults point at the Mailpit service below; set a real SMTP relay in production.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  # Catches outgoing mail in development: web inbox on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: itmapping-mailpit
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: itmapping-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  neo4j_data:
  postgres_data:
